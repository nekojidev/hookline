# Static assets from one origin, WebSocket proxied to the server
# container from the same origin at /ws — this is the "WebSockets behind
# proxies" requirement: the browser only ever talks to this one host, and
# never needs to know the backend's real address or port.
server {
    listen 80;

    location /ws {
        proxy_pass http://server:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://server:8080/health;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
