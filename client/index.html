<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hookline — Lab 4</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #c9d1d9;
      }
      .screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .screen[hidden] {
        display: none;
      }
      canvas {
        border: 2px solid #30363d;
        background: #1b2733;
      }
      .progress-track {
        width: 320px;
        height: 10px;
        background: #21262d;
        border-radius: 6px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: #e0a458;
        transition: width 120ms ease-out;
      }
      .controls {
        display: flex;
        gap: 16px;
        font-size: 14px;
      }
      button {
        padding: 8px 20px;
        cursor: pointer;
        background: #21262d;
        color: #c9d1d9;
        border: 1px solid #30363d;
        border-radius: 6px;
        font-size: 14px;
      }
      button:hover {
        background: #30363d;
      }
      input[type="text"] {
        padding: 8px 10px;
        background: #0d1117;
        color: #c9d1d9;
        border: 1px solid #30363d;
        border-radius: 6px;
        font-size: 14px;
      }
      .chat-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 360px;
      }
      .join-row {
        display: flex;
        gap: 8px;
      }
      .join-row input {
        flex: 1;
      }
      #roster {
        font-size: 13px;
        color: #8b949e;
      }
      #chat-log {
        list-style: none;
        margin: 0;
        padding: 8px;
        height: 140px;
        overflow-y: auto;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        font-size: 13px;
      }
      #chat-log li {
        margin-bottom: 4px;
      }
      #chat-form {
        display: flex;
        gap: 8px;
      }
      #chat-input {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <section id="loading-screen" class="screen">
      <h1>Hookline</h1>
      <div class="progress-track"><div id="progress-bar" class="progress-fill"></div></div>
      <span id="progress-label">Завантаження асетів…</span>
      <button id="cancel-loading">Скасувати</button>
    </section>

    <section id="lobby-screen" class="screen" hidden>
      <h1>Hookline</h1>
      <div class="controls">
        <span>P1: WASD, Space — гачок</span>
        <span>P2: стрілки, Enter — гачок</span>
      </div>

      <div class="chat-panel">
        <div class="join-row">
          <input id="player-name" type="text" maxlength="24" placeholder="Ваше ім'я" />
          <button id="join-room">Приєднатися до кімнати</button>
        </div>
        <div id="roster">Не в кімнаті</div>
        <ul id="chat-log"></ul>
        <form id="chat-form">
          <input id="chat-input" type="text" maxlength="280" placeholder="Повідомлення…" />
          <button type="submit">Надіслати</button>
        </form>
      </div>

      <button id="start-button">Почати гру</button>
    </section>

    <section id="game-screen" class="screen" hidden>
      <canvas id="game"></canvas>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
