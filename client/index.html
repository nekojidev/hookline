<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hookline — Lab 2</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: system-ui, sans-serif;
        color: #c9d1d9;
      }
      canvas {
        border: 2px solid #30363d;
        background: #1b2733;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 14px;
      }
      button {
        padding: 8px 16px;
        cursor: pointer;
        background: #21262d;
        color: #c9d1d9;
        border: 1px solid #30363d;
        border-radius: 6px;
      }
      button:hover {
        background: #30363d;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="controls">
      <span>P1: WASD, Space — гачок</span>
      <span>P2: стрілки, Enter — гачок</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
