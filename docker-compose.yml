services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - PORT=8080
      - LOG_LEVEL=info
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      server:
        condition: service_healthy
